[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Override with BMRG_DATABASE_URL in the environment.
sqlalchemy.url = postgresql+psycopg2://bmrg:bmrg@localhost:54329/bmrg

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
